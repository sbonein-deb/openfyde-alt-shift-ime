# alt-shift-ime configuration
#
# The daemon watches the physical left Alt and left Shift keys and injects the
# configured combination after both modifiers are released.
#
# combo:          ctrl+space, ctrl+shift+space, search+space, ...
# delay_ms:       delay after the final modifier release before injecting
# rescan_seconds: how often to look for newly plugged keyboards
# dry_run:        detect the chord but do not inject
# verbose:        log every key event (useful for debugging)

combo=ctrl+space
delay_ms=80
rescan_seconds=2
# dry_run=false
# verbose=false
