name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: test
        run: |
          go vet ./...
          go test -race ./...

      - name: package
        run: ./scripts/package.sh "$GITHUB_REF_NAME"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/*.tar.gz \
            dist/release/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
