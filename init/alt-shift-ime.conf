# left Alt + left Shift language switcher for OpenFyde/ChromeOS
description     "Inject Ctrl+Space when left Alt + left Shift are released"
author          "sbonein-deb"

start on started system-services

respawn
respawn limit 10 60
oom score never
kill timeout 5

script
  exec /usr/local/bin/alt-shift-ime run --config /usr/local/etc/alt-shift-ime.conf >> /var/log/alt-shift-ime.log 2>&1
end script
